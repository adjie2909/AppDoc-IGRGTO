{% extends 'base.html' %}

{% block title %}Masuk - AppDoc IGRGTO{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card card-custom p-4">
        <div class="text-center mb-4">
          <h3 class="fw-bold" style="color: var(--primary-blue);">AppDoc IGRGTO</h3>
          <p class="text-muted small">Silakan masuk ke akun kerja Anda</p>
        </div>

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">UserID</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            {{ form.password }}
          </div>
          
          <button type="submit" class="btn btn-primary-appdoc w-100 py-2 mt-2">Masuk</button>
        </form>

        <div class="text-center mt-3">
          <span class="small text-muted">Belum punya akun?</span>
          <a href="{% url 'accounts:register' %}" class="small text-decoration-none fw-bold" style="color: var(--primary-blue);">Daftar di sini</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
